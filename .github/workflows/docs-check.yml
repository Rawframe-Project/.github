name: docs check

# Superseded by the docs-check action (.github/actions/docs-check), which
# runs the script from the commit a repository pins. This workflow checks out
# this repository with no ref, so it runs the script from main whatever its
# caller pins. It stays until every caller has moved to the action.

on:
  workflow_call:
    inputs:
      exclude:
        description: Space-separated path prefixes to skip, such as vendored code.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Rawframe-Project/.github
          path: .org-defaults
          persist-credentials: false
      - name: Check documentation
        env:
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          args=()
          for e in $EXCLUDE; do args+=(--exclude "$e"); done
          python3 .org-defaults/scripts/docs_check.py --exclude .org-defaults "${args[@]}"
