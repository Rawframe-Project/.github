name: pull request title

# Reusable: call from a repository with
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     title:
#       uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@main
#       with:
#         scopes: core text tools

on:
  workflow_call:
    inputs:
      scopes:
        description: Space-separated scopes the repository accepts. Empty accepts any lower-case scope.
        type: string
        default: ""

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          SCOPES: ${{ inputs.scopes }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'EOF'
          import os, re, sys
          title = os.environ["TITLE"]
          scopes = os.environ["SCOPES"].split()
          types = "feat|fix|perf|refactor|docs|test|build|ci|chore"
          m = re.fullmatch(rf"({types})(\(([a-z0-9-]+)\))?!?: ([a-z0-9`].*)", title)
          problems = []
          if not m:
              problems.append(f"the title is not 'type(scope): summary' with a type from {types.replace('|', ', ')} and a lower-case summary")
          else:
              if scopes and m.group(3) and m.group(3) not in scopes:
                  problems.append(f"scope '{m.group(3)}' is not one of: {', '.join(scopes)}")
              if title.endswith("."):
                  problems.append("the title ends with a period")
          # Dependabot's titles name the package, both versions and the folder;
          # it cannot shorten them, so only its titles may run longer.
          if len(title) > 72 and os.environ["AUTHOR"] != "dependabot[bot]":
              problems.append(f"the title is {len(title)} characters, over 72")
          if "\u2014" in title:
              problems.append("the title has an em dash")
          # The body becomes the squash commit's message, which release-please
          # parses line by line as possible commit headers. A line that starts
          # with a name and "(" whose scope does not close before another "("
          # or the line's end is a parse error, and the whole commit is
          # dropped; a line that reads as a header of a changelog type, or one
          # marked breaking, adds an entry of its own.
          types = "feat|fix|perf|refactor|docs|test|build|ci|chore|revert|deps"
          for n, line in enumerate((os.environ.get("BODY") or "").splitlines(), 1):
              if re.match(r"[^\s():!]+\([^)]*(\(|$)", line):
                  problems.append(f"body line {n} would make release-please drop the commit (indent it or reword its start): {line[:60]}")
              elif re.match(rf"(?i)({types})(\([^()]*\))?!?:\s|[^\s():!]+(\([^()]*\))?!:", line):
                  problems.append(f"body line {n} reads to release-please as a commit header of its own: {line[:60]}")
          for p in problems:
              print(f"pull request: {p}")
          sys.exit(1 if problems else 0)
          EOF
