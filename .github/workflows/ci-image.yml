# Builds the C and C++ CI image from ci/cpp for amd64 and arm64, each on
# its own native runner, and publishes ghcr.io/rawframe-project/ci-cpp:
# <VERSION> from main as one multi-architecture image. A pull request builds
# both without publishing, and the weekly run shows breakage in the image's
# inputs before a version bump needs them.
name: ci-image

on:
  pull_request:
    paths: [ci/cpp/**, .github/workflows/ci-image.yml]
  push:
    branches: [main]
    paths: [ci/cpp/**, .github/workflows/ci-image.yml]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/rawframe-project/ci-cpp

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(tr -d '[:space:]' < ci/cpp/VERSION)
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || { echo "::error::VERSION is not YYYY.MM.N: $version"; exit 1; }
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only "$BASE"...HEAD)
            if grep -qx 'ci/cpp/Dockerfile' <<<"$changed" && ! grep -qx 'ci/cpp/VERSION' <<<"$changed"; then
              echo "::error::ci/cpp/VERSION must change when ci/cpp/Dockerfile does"; exit 1
            fi
          fi
          publish=false
          if [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; then publish=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        env:
          TAG: ${{ needs.version.outputs.version }}-${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker build --pull \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$IMAGE:$TAG" ci/cpp

      - name: Smoke test
        env:
          TAG: ${{ needs.version.outputs.version }}-${{ matrix.arch }}
        run: |
          docker run --rm "$IMAGE:$TAG" sh -ec '
            clang --version; gcc-14 --version; cmake --version; ninja --version
            ccache --version; clang-format --version; clang-tidy --version
            printf "int main(void){return 0;}\n" > /tmp/t.c
            clang -fsanitize=address,undefined /tmp/t.c -o /tmp/t && /tmp/t
            gcc-14 /tmp/t.c -o /tmp/t && /tmp/t
            node --version; npm --version; dbus-daemon --version | head -1
            llvm-symbolizer --version | head -1; llvm-profdata merge --help >/dev/null; llvm-cov --version | head -1
            pipewire --version; wireplumber --version | head -1; pactl --version | head -1
            git config --system --get-all safe.directory | grep -qx "*"'

      # A published version is never overwritten: a repository pinned to it
      # keeps the toolchain it was tested with.
      - name: Publish
        if: needs.version.outputs.publish == 'true'
        env:
          TAG: ${{ needs.version.outputs.version }}-${{ matrix.arch }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "$IMAGE:$TAG is already published"; exit 0
          fi
          docker push "$IMAGE:$TAG"

  # Joins the two architectures under the version tag, the one repositories pin.
  manifest:
    needs: [version, image]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Publish the multi-architecture image
        id: publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published"; exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$VERSION@$digest"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.publish.outputs.digest != ''
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
