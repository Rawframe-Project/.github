version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release is taken a week after it is published, once others have run it.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /workflow-templates
    schedule:
      interval: weekly
    # A release is taken a week after it is published, once others have run it.
    cooldown:
      default-days: 7
    groups:
      templates:
        patterns: ["*"]
